name: OpenAI PR Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install openai

      - name: Run OpenAI PR Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<EOF
          import openai
          import os

          openai.api_key = os.getenv("OPENAI_API_KEY")

          # Fetch PR changes (example)
          pr_diff = os.popen("git diff HEAD^ HEAD").read()

          # Generate review using OpenAI
          response = openai.ChatCompletion.create(
            model="gpt-4",
            messages=[
              {"role": "system", "content": "You are a helpful code reviewer."},
              {"role": "user", "content": f"Review the following code changes:\n\n{pr_diff}"}
            ]
          )

          # Post review as a comment
          review = response['choices'][0]['message']['content']
          print(f"::set-output name=review::{review}")
          EOF

      - name: Post Review Comment
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `### AI Code Review\n\n${{ steps.review.outputs.review }}`
            });
